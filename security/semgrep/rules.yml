rules:
  - id: hardcoded-secret
    patterns:
      - pattern-regex: "(password|secret|token|key)[\\s]*=[\\s]*['\"][^'\"\\s]{8,}['\"]"
    message: Hardcoded secret detected
    languages: [python, javascript, typescript, java, go]
    severity: ERROR

  - id: debug-enabled
    patterns:
      - pattern: debug = True
      - pattern: DEBUG = true
    message: Debug mode enabled in production code
    languages: [python]
    severity: WARNING
