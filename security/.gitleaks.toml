title = "Конфигурация Gitleaks для проекта"

# Использовать дефолтные правила
[extend]
useDefault = true

# Allowlist для ложных срабатываний
[allowlist]
description = "Известные тестовые значения и false positives"

# Пути к файлам для игнорирования
paths = [
  "**/test_*.py",
  "**/*.test.js",
  "**/__pycache__/**",
  "**/node_modules/**",
  "EVIDENCE/**"
]

# Регулярные выражения для игнорирования
regexes = [
  '''test_.*_key''',
  '''example_.*''',
  '''fake_.*''',
  '''00000000-0000-0000-0000-000000000000''',  # Пример UUID
  '''1234567890abcdef1234567890abcdef12345678''',  # Пример хеша
]

# Коммиты для игнорирования (по хешу)
commits = []
