name: P10 SAST & Secrets Scan

on:
  push:
    branches: [ main ]
    paths:
      - '**.py'
      - '**.js'
      - '**.ts'
      - '**.java'
      - '**.go'
      - 'security/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write  # Нужно для создания PR или коммита
  issues: write
  pull-requests: write

jobs:
  semgrep-scan:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Create EVIDENCE directory
      run: mkdir -p EVIDENCE/P10

    - name: Run Semgrep SAST
      id: semgrep
      uses: returntocorp/semgrep-action@v1
      with:
        config: p/ci
        output-format: sarif
        output-file: EVIDENCE/P10/semgrep.sarif
        severity: ERROR
        # НЕ завершать с ошибкой при нахождении проблем
        # continue-on-error: true

    - name: Run Custom Semgrep Rules
      run: |
        semgrep --config security/semgrep/rules.yml \
          --sarif \
          --output EVIDENCE/P10/semgrep-custom.sarif \
          --metrics=off \
          --error
        echo "Custom rules scan completed"
      continue-on-error: true  # Не прерывать workflow

    - name: Count findings
      run: |
        echo "=== Semgrep Summary ==="
        if [ -f "EVIDENCE/P10/semgrep.sarif" ]; then
          COUNT=$(jq '.runs[0].results | length' EVIDENCE/P10/semgrep.sarif 2>/dev/null || echo "0")
          echo "Standard rules findings: $COUNT"
        fi
        if [ -f "EVIDENCE/P10/semgrep-custom.sarif" ]; then
          COUNT_CUSTOM=$(jq '.runs[0].results | length' EVIDENCE/P10/semgrep-custom.sarif 2>/dev/null || echo "0")
          echo "Custom rules findings: $COUNT_CUSTOM"
        fi

    - name: Upload SARIF to GitHub Code Scanning
      uses: github/codeql-action/upload-sarif@v3
      if: always() && github.event_name == 'push'
      with:
        sarif_file: EVIDENCE/P10/semgrep.sarif
        category: semgrep-sast

  gitleaks-scan:
    runs-on: ubuntu-latest
    needs: semgrep-scan
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Вся история для сканирования коммитов

    - name: Create EVIDENCE directory
      run: mkdir -p EVIDENCE/P10

    - name: Run Gitleaks
      id: gitleaks
      uses: gitleaks/gitleaks-action@v2
      with:
        config-path: security/.gitleaks.toml
        report-format: json
        report-path: EVIDENCE/P10/gitleaks.json
        redact: true
        verbose: true
      continue-on-error: true  # Не прерывать workflow при нахождении секретов

    - name: Count Gitleaks findings
      run: |
        echo "=== Gitleaks Summary ==="
        if [ -f "EVIDENCE/P10/gitleaks.json" ]; then
          COUNT=$(jq '. | length' EVIDENCE/P10/gitleaks.json 2>/dev/null || echo "0")
          echo "Secrets found: $COUNT"

          # Группировка по типу секрета
          echo "Breakdown by type:"
          jq -r '.[].Description' EVIDENCE/P10/gitleaks.json 2>/dev/null | sort | uniq -c || echo "No findings or error"
        fi

  save-reports:
    runs-on: ubuntu-latest
    needs: [semgrep-scan, gitleaks-scan]
    if: always()  # Всегда выполняем, даже если предыдущие шаги упали

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Download artifacts from previous jobs
      run: |
        mkdir -p reports
        # Здесь можно скачать артефакты, если они были загружены
        echo "Artifacts will be available in workflow summary"

    - name: Create summary markdown
      run: |
        echo "# SAST & Secrets Scan Report" > EVIDENCE/P10/sast_summary.md
        echo "**Scan date:** $(date)" >> EVIDENCE/P10/sast_summary.md
        echo "**Branch:** ${{ github.ref }}" >> EVIDENCE/P10/sast_summary.md
        echo "**Workflow run:** [${{ github.run_id }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> EVIDENCE/P10/sast_summary.md
        echo "" >> EVIDENCE/P10/sast_summary.md

        echo "## Semgrep Findings" >> EVIDENCE/P10/sast_summary.md
        if [ -f "EVIDENCE/P10/semgrep.sarif" ]; then
          echo "- Standard rules: $(jq '.runs[0].results | length' EVIDENCE/P10/semgrep.sarif 2>/dev/null || echo '0') findings" >> EVIDENCE/P10/sast_summary.md
        fi
        if [ -f "EVIDENCE/P10/semgrep-custom.sarif" ]; then
          echo "- Custom rules: $(jq '.runs[0].results | length' EVIDENCE/P10/semgrep-custom.sarif 2>/dev/null || echo '0') findings" >> EVIDENCE/P10/sast_summary.md
        fi

        echo "" >> EVIDENCE/P10/sast_summary.md
        echo "## Gitleaks Findings" >> EVIDENCE/P10/sast_summary.md
        if [ -f "EVIDENCE/P10/gitleaks.json" ]; then
          echo "- Total secrets: $(jq '. | length' EVIDENCE/P10/gitleaks.json 2>/dev/null || echo '0')" >> EVIDENCE/P10/sast_summary.md
        fi

        echo "" >> EVIDENCE/P10/sast_summary.md
        echo "## Next Steps" >> EVIDENCE/P10/sast_summary.md
        echo "1. Review findings in SARIF and JSON reports" >> EVIDENCE/P10/sast_summary.md
        echo "2. Fix critical vulnerabilities immediately" >> EVIDENCE/P10/sast_summary.md
        echo "3. Add false positives to allowlists" >> EVIDENCE/P10/sast_summary.md
        echo "4. Update backlog with non-critical issues" >> EVIDENCE/P10/sast_summary.md

    - name: Upload reports as artifacts
      uses: actions/upload-artifact@v4
      with:
        name: security-reports
        path: EVIDENCE/P10/
        retention-days: 30

    - name: Commit reports to repository (optional)
      run: |
        # Добавляем отчеты в git
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"

        git add EVIDENCE/P10/

        # Проверяем, есть ли изменения
        if git diff --cached --quiet; then
          echo "No changes to commit"
        else
          git commit -m "P10: Update SAST and secrets scan reports [skip ci]"
          git push origin ${{ github.ref }}
          echo "Reports committed to repository"
        fi
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
