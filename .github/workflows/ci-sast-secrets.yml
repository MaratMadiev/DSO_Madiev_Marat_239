name: P10 - SAST & Secrets Scanning

on:
  push:
    branches:
      - 'p[0-9][0-9]-*'
    paths:
      - '**.py'
      - '**.js'
      - '**.ts'
      - '**.java'
      - '**.go'
      - '**.json'
      - '**.yml'
      - '**.yaml'
      - 'security/**'
      - '.github/workflows/**'
  pull_request:
    branches:
      - 'p[0-9][0-9]-*'
  workflow_dispatch:

jobs:
  sast-and-secrets:
    name: Run SAST & Secrets Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write

    steps:
      # 1. Получаем код
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Полная история для Gitleaks

      # 2. Создаем директорию для отчетов
      - name: Create directories
        run: |
          mkdir -p EVIDENCE/P10
          mkdir -p security/semgrep

      # 3. Запускаем Semgrep (SAST)
      - name: Run Semgrep SAST Scan
        id: semgrep
        continue-on-error: true  # Не падать при найденных проблемах
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/src" \
            returntocorp/semgrep:latest \
            semgrep scan \
            --config=p/ci \
            --sarif \
            --output=/src/EVIDENCE/P10/semgrep.sarif \
            --error
          echo "Semgrep scan completed. Report saved."

      # 4. Запускаем Gitleaks (Secrets)
      - name: Run Gitleaks Secrets Scan
        id: gitleaks
        continue-on-error: true  # Не падать при найденных секретах
        run: |
          # Сначала проверяем, существует ли конфиг
          if [ -f "security/.gitleaks.toml" ]; then
            CONFIG_ARG="--config-path=/src/security/.gitleaks.toml"
          else
            CONFIG_ARG=""
            echo "Using default Gitleaks config"
          fi

          docker run --rm \
            -v "${{ github.workspace }}:/src" \
            zricethezav/gitleaks:latest \
            detect \
            --source="/src" \
            $CONFIG_ARG \
            --report-format=json \
            --report-path=/src/EVIDENCE/P10/gitleaks.json \
            --verbose \
            --no-git
          echo "Gitleaks scan completed. Report saved."

      # 5. Создаем сводный отчет
      - name: Generate Summary Report
        run: |
          cat > EVIDENCE/P10/sast_summary.md << 'EOF'
          # SAST & Secrets Scanning Report

          ## Общая информация
          - **Дата сканирования:** $(date)
          - **Ветка:** ${{ github.ref }}
          - **Коммит:** ${{ github.sha }}
          - **Workflow Run:** ${{ github.run_id }}

          ## Semgrep (SAST)
          - **Конфигурация:** p/ci профиль + кастомные правила
          - **Отчет:** semgrep.sarif
          - **Статус:** ${{ steps.semgrep.outcome }}

          ## Gitleaks (Secrets)
          - **Конфигурация:** security/.gitleaks.toml
          - **Отчет:** gitleaks.json
          - **Статус:** ${{ steps.gitleaks.outcome }}

          ## Действия
          1. Отчеты сохранены в EVIDENCE/P10/
          2. Найденные проблемы требуют ручной проверки
          3. Ложные срабатывания добавлены в allowlist

          ## Следующие шаги
          - Проверить отчеты semgrep.sarif и gitleaks.json
          - Исправить критичные уязвимости
          - Обновить allowlist при необходимости
          EOF

          echo "Summary report created at EVIDENCE/P10/sast_summary.md"

      # 6. Показываем что создалось
      - name: List Generated Reports
        run: |
          echo "=== Созданные отчеты ==="
          ls -la EVIDENCE/P10/
          echo ""
          echo "=== Размер отчетов ==="
          du -h EVIDENCE/P10/*

      # 7. Загружаем артефакты
      - name: Upload Reports as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: p10-sast-secrets-reports
          path: EVIDENCE/P10/
          retention-days: 7

      # 8. Загружаем в GitHub Security
      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: EVIDENCE/P10/semgrep.sarif
          wait-for-processing: false
