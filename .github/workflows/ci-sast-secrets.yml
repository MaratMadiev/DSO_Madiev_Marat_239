name: SAST & Secrets Scanning

on:
  push:
    branches:
      - 'p[0-9][0-9]-*'
  pull_request:
    branches:
      - 'p[0-9][0-9]-*'
  workflow_dispatch:

jobs:
  sast-secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Create directories
        run: |
          mkdir -p EVIDENCE/P10
          mkdir -p security/semgrep

      - name: Run Semgrep SAST
        run: |
          docker run --rm -v "${PWD}:/src" returntocorp/semgrep \
            semgrep scan --config=p/ci --sarif --output=/src/EVIDENCE/P10/semgrep.sarif \
            || echo "Semgrep completed with findings"

      - name: Run Gitleaks
        run: |
          docker run --rm -v "${PWD}:/src" zricethezav/gitleaks:v8.15.0 \
            detect --source="/src" --config-path="/src/security/.gitleaks.toml" \
            --report-format=json --report-path=/src/EVIDENCE/P10/gitleaks.json \
            --verbose || echo "Gitleaks completed with findings"

      - name: List generated files
        run: ls -la EVIDENCE/P10/
